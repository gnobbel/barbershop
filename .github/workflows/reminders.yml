name: Appointment reminders

# Vercel's free plan only runs cron jobs once a day, so GitHub calls the
# reminder endpoint every 15 minutes instead. Needs two repository secrets:
#   SITE_URL     e.g. https://your-site.vercel.app
#   CRON_SECRET  the same value as the CRON_SECRET env var on Vercel
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Send due reminders
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SITE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "SITE_URL / CRON_SECRET secrets not set yet; skipping."
            exit 0
          fi
          curl --fail-with-body --silent --show-error --max-time 60 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "${SITE_URL%/}/api/cron/reminders"
